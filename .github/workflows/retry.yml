name: OCI Ampere VM Provisioner

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Prevents two runs from overlapping if GitHub delays a cron trigger
concurrency:
  group: oci-capacity-hunter
  cancel-in-progress: false

jobs:
  hunt-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Install OCI CLI (Fast)
        run: |
          pip install --quiet oci-cli

      - name: Configure OCI Auth
        env:
          USER_OCID: ${{ secrets.OCI_USER_OCID }}
          TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          REGION: ${{ secrets.OCI_REGION }}
          KEY_CONTENT: ${{ secrets.OCI_KEY_FILE }}
        run: |
          mkdir -p ~/.oci
          printf "%s\n" "$KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${USER_OCID}
          fingerprint=${FINGERPRINT}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${TENANCY_OCID}
          region=${REGION}
          EOF
          chmod 600 ~/.oci/config
          oci setup repair-file-permissions --file ~/.oci/config
          oci setup repair-file-permissions --file ~/.oci/oci_api_key.pem

      - name: Auto-Retry VM Stack Apply
        env:
          STACK_ID: ${{ secrets.OCI_STACK_ID }}
          TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          # 1. Safely check if any active instance exists in the compartment
          EXISTING_VM=$(oci compute instance list \
            --compartment-id "$TENANCY_OCID" \
            --query "data[?\"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'].id | [0]" \
            --raw-output 2>/dev/null || true)

          if [ -n "$EXISTING_VM" ] && [ "$EXISTING_VM" != "null" ]; then
            echo "✅ Active VM already exists (OCID: $EXISTING_VM)! Stopping hunter."
            exit 0
          fi

          echo "=========================================================="
          echo "🚀 Starting 24-minute hunting cycle for thepurplepulsars-VM"
          echo "Target Stack: $STACK_ID"
          echo "=========================================================="
          
          END_TIME=$((SECONDS + 1440)) # 24 minutes
          ATTEMPT=1
          
          while [ $SECONDS -lt $END_TIME ]; do
            echo ""
            echo "[$(date +'%Y-%m-%d %T')] 📡 Attempt #$ATTEMPT: Requesting Apply..."
            
            OUT=$(oci resource-manager job create-apply-job \
              --stack-id "$STACK_ID" \
              --execution-plan-strategy AUTO_APPROVED \
              --query 'data.id' \
              --raw-output 2>&1 || true)
            
            if [[ "$OUT" == ocid1.ormjob.* ]]; then
              JOB_ID="$OUT"
              echo "   📋 Job ID: $JOB_ID. Waiting for Terraform execution..."
              STATUS="IN_PROGRESS"
              while [ "$STATUS" = "ACCEPTED" ] || [ "$STATUS" = "IN_PROGRESS" ]; do
                sleep 10
                STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || true)
              done
              
              if [ "$STATUS" = "SUCCEEDED" ]; then
                echo ""
                echo "🎉🎉🎉 SUCCESS! thepurplepulsars-VM has been created! 🎉🎉🎉"
                exit 0
              else
                echo "   ❌ Job finished with status: $STATUS (Out of host capacity)."
              fi
            else
              echo "   ⚠️ Could not trigger job. Output: $OUT"
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            echo "   💤 Sleeping 90 seconds before next attempt..."
            sleep 90
          done
          
          echo "Cycle finished. Waiting for next scheduled workflow run."